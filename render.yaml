databases:
  - name: lashbook2-db
    plan: free
    databaseName: lashbook2
    user: lashbook2

services:
  - type: web
    name: lashbook2
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    branch: lashbook2
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Lashbook2
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: lashbook2-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
